# Continuous integration: verifies required files, lints Python and CloudFormation,
# and runs the test suite on every push and pull request to main/dev.
# Deployment itself is handled by AWS CodePipeline (see infrastructure/pipeline.yaml).

name: TestsPackage

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: requirements-dev.txt

    - name: Check presence of required files
      run: python tests/test_required_files.py

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements-dev.txt

    - name: Lint with flake8
      run: python -m flake8 . --count --show-source --statistics

    - name: Test with pytest
      run: python -m pytest -v tests/

  infrastructure:
    name: Lint CloudFormation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: requirements-dev.txt

    - name: Install cfn-lint
      run: python -m pip install -r requirements-dev.txt

    - name: Lint templates
      run: cfn-lint infrastructure/*.yaml
