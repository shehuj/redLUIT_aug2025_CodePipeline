# CodeBuild spec for the "Test" stage of the pipeline defined in infrastructure/pipeline.yaml.
# Runs the test suite and publishes only the site files, so repository internals
# (tests, workflows, policies, README) are never uploaded to the website bucket.
version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - python -m pip install --upgrade pip
      - python -m pip install -r requirements-dev.txt
  build:
    commands:
      - python tests/test_required_files.py
      - python -m flake8 .
      - python -m pytest -q tests/ --junitxml=reports/junit.xml

reports:
  pytest-reports:
    files:
      - junit.xml
    base-directory: reports
    file-format: JUNITXML

artifacts:
  files:
    - '*.html'
